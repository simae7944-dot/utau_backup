<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우타우 캐릭터 위키</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--card:#fff;--ink:#1B2233;--mute:#5D6980;--line:#D5DCE6;--acc:#167C79;--acc-ink:#fff;--chip:#E1E8F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 6px;font-size:14px}
.status{font-size:12px;color:var(--mute);margin-bottom:14px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:90px}
#q{margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.lbl{font-size:13px;color:var(--mute);width:56px;flex:none}
button{font:inherit;color:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--chip);color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;gap:8px;flex-wrap:wrap}
.count{font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.top{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none;object-fit:cover}
.nm{font-weight:700;font-size:16px}
.cat{font-size:12px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 8px}
.empty{padding:32px 0;text-align:center;color:var(--mute);grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(460px,calc(100% - 32px));padding:20px;max-height:90vh}
dialog::backdrop{background:rgba(10,15,25,.55)}
dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:14px 0;font-size:14px}
dt{color:var(--mute)}dd{margin:0}
.big{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-top:12px;background:var(--chip)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<main>
  <h1>우타우 캐릭터 위키</h1>
  <p class="sub">이 링크를 받은 사람끼리 함께 캐릭터를 추가·수정해요.</p>
  <p class="status" id="status">불러오는 중…</p>
  <input type="search" id="q" placeholder="이름·제작자·태그 검색">
  <div class="row"><span class="lbl">카테고리</span><span id="cats" class="row" style="margin:0"></span></div>
  <div class="row"><span class="lbl">태그</span><span id="tags" class="row" style="margin:0"></span></div>
  <div class="bar"><span class="count" id="count"></span>
    <span><button class="btn" id="add">캐릭터 추가</button></span></div>
  <div class="grid" id="grid"></div>
  <dialog id="dlg"></dialog>
  <dialog id="fm">
    <b id="ft">캐릭터 추가</b>
    <label for="f_n">이름</label><input id="f_n">
    <label for="f_c">카테고리</label><input id="f_c" list="cl"><datalist id="cl"></datalist>
    <label for="f_t">태그 (쉼표로 구분)</label><input id="f_t">
    <label for="f_by">제작자</label><input id="f_by">
    <label for="f_y">공개 연도</label><input id="f_y" inputmode="numeric">
    <label for="f_d">소개</label><textarea id="f_d"></textarea>
    <label for="f_i">이미지</label><input id="f_i" type="file" accept="image/*">
    <div class="acts"><button class="btn ghost" id="f_x">취소</button><button class="btn" id="f_s">저장</button></div>
  </dialog>
  <div id="toast" role="status"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY='utau-wiki-characters-v1';
const CAN = typeof window!=='undefined' && !!window.storage;
let DATA=[];
let VER=0; // 충돌 방지를 위한 아주 단순한 버전 번호
const st={cat:'전체',tags:new Set(),q:''};
let editId=null,newImg=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&lt;'.slice(0,0)||c,'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const okImg=s=>typeof s==='string'&&s.startsWith('data:image/jpeg;base64,');
const av=x=>okImg(x.img)?`<img class="av" alt="" src="${x.img}">`:`<span class="av" style="background:hsl(${hue(x.n||'?')} 45% 42%)">${esc((x.n||'?')[0])}</span>`;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}

async function load(initial){
  if(!CAN){$('status').textContent='이 화면은 공유 저장소를 지원하지 않아요. claude.ai에서 공유 링크로 열어주세요.';return}
  try{
    const r=await window.storage.get(KEY,true);
    if(r&&r.value){const p=JSON.parse(r.value);DATA=p.list||[];VER=p.ver||0}
    $('status').textContent='모두에게 공유된 목록이에요. 추가하면 링크를 받은 사람 모두에게 보여요.';
  }catch(e){ $('status').textContent='처음 만들어진 위키예요. 첫 캐릭터를 추가해 보세요.'; }
  render();
  if(initial) setInterval(poll,4000);
}
async function poll(){
  if(!CAN) return;
  try{
    const r=await window.storage.get(KEY,true);
    if(r&&r.value){const p=JSON.parse(r.value);
      if((p.ver||0)!==VER){DATA=p.list||[];VER=p.ver||0;render();}
    }
  }catch(e){}
}
async function save(mutator){
  if(!CAN){toast('저장소를 쓸 수 없어요');return}
  try{
    const r=await window.storage.get(KEY,true);
    let list=DATA,ver=VER;
    if(r&&r.value){const p=JSON.parse(r.value);list=p.list||[];ver=p.ver||0}
    list=mutator(list.slice());
    ver+=1;
    await window.storage.set(KEY,JSON.stringify({list,ver}),true);
    DATA=list;VER=ver;render();toast('저장했어요');
  }catch(e){toast('저장하지 못했어요. 다시 시도해 주세요')}
}

function chips(el,list,isOn,fn){el.innerHTML='';list.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=v;b.setAttribute('aria-pressed',isOn(v));b.onclick=()=>{fn(v);render()};el.appendChild(b)})}
function render(){
  const cats=['전체',...new Set(DATA.map(x=>x.c).filter(Boolean))];
  const freq={};DATA.forEach(x=>(x.t||[]).forEach(t=>freq[t]=(freq[t]||0)+1));
  const tags=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,30);
  chips($('cats'),cats,v=>st.cat===v,v=>st.cat=v);
  chips($('tags'),tags,v=>st.tags.has(v),v=>st.tags.has(v)?st.tags.delete(v):st.tags.add(v));
  $('cl').innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join('');
  const q=st.q.toLowerCase();
  const list=DATA.filter(x=>(st.cat==='전체'||x.c===st.cat)&&[...st.tags].every(t=>(x.t||[]).includes(t))&&(!q||(x.n+' '+(x.by||'')+' '+(x.t||[]).join(' ')).toLowerCase().includes(q)));
  $('count').textContent=`캐릭터 ${list.length}명`;
  const g=$('grid');g.innerHTML='';
  if(!list.length){g.innerHTML='<div class="empty">아직 캐릭터가 없어요. 첫 캐릭터를 추가해 보세요.</div>'}
  list.forEach(x=>{const b=document.createElement('button');b.className='card';
    b.innerHTML=`<span class="top">${av(x)}<span><span class="nm">${esc(x.n)}</span><br><span class="cat">${esc(x.c)}</span></span></span><span class="tags">${(x.t||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</span>`;
    b.onclick=()=>detail(x);g.appendChild(b)});
}
function detail(x){
  const d=$('dlg');
  d.innerHTML=`<div class="top">${av(x)}<div><div class="nm">${esc(x.n)}</div><div class="cat">${esc(x.c)}</div></div></div>${okImg(x.img)?`<img class="big" alt="${esc(x.n)}" src="${x.img}">`:''}
  <dl><dt>제작자</dt><dd>${esc(x.by)||'-'}</dd><dt>공개</dt><dd>${esc(x.y)||'-'}</dd><dt>태그</dt><dd>${esc((x.t||[]).join(', '))||'-'}</dd><dt>소개</dt><dd>${esc(x.d)||'-'}</dd></dl>
  <div class="acts"><button class="btn ghost" id="d_del">삭제</button><button class="btn ghost" id="d_ed">수정</button><button class="btn" id="d_x">닫기</button></div>`;
  $('d_x').onclick=()=>d.close();
  $('d_ed').onclick=()=>{d.close();form(x)};
  $('d_del').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent='정말 삭제';return}d.close();save(list=>list.filter(y=>y.id!==x.id))};
  d.showModal();
}
function form(x){
  editId=x?x.id:null;newImg=null;$('ft').textContent=x?'캐릭터 수정':'캐릭터 추가';
  $('f_n').value=x?x.n:'';$('f_c').value=x?x.c:'';$('f_t').value=x?(x.t||[]).join(', '):'';$('f_by').value=x?x.by||'':'';$('f_y').value=x?x.y||'':'';$('f_d').value=x?x.d||'':'';$('f_i').value='';
  $('fm').showModal();
}
$('f_i').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const k=c.getContext('2d');k.fillStyle='#fff';k.fillRect(0,0,c.width,c.height);k.drawImage(im,0,0,c.width,c.height);newImg=c.toDataURL('image/jpeg',.72)};im.src=r.result};r.readAsDataURL(f)};
$('f_x').onclick=()=>$('fm').close();
$('f_s').onclick=()=>{
  const n=$('f_n').value.trim();if(!n){toast('이름을 입력해 주세요');return}
  const o={id:editId||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),n,c:$('f_c').value.trim()||'미분류',t:$('f_t').value.split(',').map(s=>s.trim()).filter(Boolean),by:$('f_by').value.trim(),y:$('f_y').value.trim(),d:$('f_d').value.trim()};
  const old=DATA.find(y=>y.id===editId);if(old&&old.img&&!newImg)o.img=old.img;if(newImg)o.img=newImg;
  $('fm').close();
  save(list=>{const i=list.findIndex(y=>y.id===o.id);if(i>=0)list[i]=o;else list.unshift(o);return list});
};
$('add').onclick=()=>form(null);
$('q').oninput=e=>{st.q=e.target.value.trim();render()};
load(true);
</script>
</body>
</html>
